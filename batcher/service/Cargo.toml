[package]
name = "bad-bridge-batcher"
version = "0.1.0"
edition = "2021"

[dependencies]
sp1-sdk = { version = "=6.1.0", default-features = false, features = ["blocking", "network"] }
alloy = { version = "1.8", features = ["providers", "signer-local", "sol-types", "contract", "network", "reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bech32 = "0.11"
chrono = "0.4"
hex = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

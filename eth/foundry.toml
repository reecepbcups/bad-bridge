[profile.default]
fs_permissions = [{ access = "read", path = "./" }]
src = "src"
out = "out"
libs = ["lib"]
# votes pushed the unoptimized runtime to 21.7 KB, too close to the 24 KB limit
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[fuzz]
runs = 5000

[invariant]
# a handler revert means a proven kid could not be claimed
fail_on_revert = true
